name: 法規自動檢索 (Regulation Watch)

on:
  schedule:
    # GitHub Actions 使用 UTC。台北時間週五 04:00 = UTC 週四 20:00
    - cron: '0 20 * * 4'
  workflow_dispatch:   # 允許手動觸發測試

permissions:
  contents: write
  issues: write

jobs:
  regwatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 執行法規檢索比對
        id: check
        run: |
          cd .regwatch
          set +e
          python check_regulations.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
        continue-on-error: true

      - name: 提交更新後的基準與雜湊
        run: |
          git config user.name "regwatch-bot"
          git config user.email "actions@github.com"
          git add .regwatch/baseline.json .regwatch/hashes.json .regwatch/changes.md
          git commit -m "regwatch: 更新法規檢查基準 $(date +%Y-%m-%d)" || echo "無變更可提交"
          git push || echo "無法推送（可能無變更）"

      - name: 有變動時開啟 Issue
        if: steps.check.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.regwatch/changes.md', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 法規變動偵測 ${today}`,
              body: body,
              labels: ['regulation-watch']
            });
